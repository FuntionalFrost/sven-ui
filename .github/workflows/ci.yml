name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-check:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Run svelte-check
        run: pnpm check

      - name: Package library (svelte-package)
        run: pnpm package

      - name: Build SvelteKit site & SSR bundle
        run: pnpm build
        env:
          PUBLIC_APP_URL: https://yaxa.vercel.app
          BETTER_AUTH_SECRET: ci-dummy-secret-key-123456789-production
          BETTER_AUTH_URL: https://yaxa.vercel.app
